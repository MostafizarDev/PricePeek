name: PricePeek Code Check

on:
  push:
    paths:
      - 'lib/**'
      - 'api/**'
      - 'js/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'lib/**'
      - 'api/**'
      - 'js/**'
      - '.github/workflows/**'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in lib/*.js api/*.js js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
