name: PricePeek Code Check

on:
  push:
    paths:
      - 'crawler/**'
      - 'lib/**'
      - 'api/search.js'
      - 'js/app.js'
      - 'google-apps-script/Code.gs'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'crawler/**'
      - 'lib/**'
      - 'api/search.js'
      - 'js/app.js'
      - 'google-apps-script/Code.gs'
      - '.github/workflows/**'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          set -e
          node --check crawler/run.js
          node --check crawler/catalogCache.js
          node --check lib/baseScraper.js
          node --check lib/normalize.js
          node --check lib/daraz.js
          node --check api/search.js
          node --check js/app.js
          node --check google-apps-script/Code.gs
