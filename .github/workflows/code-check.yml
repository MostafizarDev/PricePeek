name: PricePeek Code Check

on:
  push:
    paths:
      - 'lib/**'
      - 'api/**'
      - 'js/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'lib/**'
      - 'api/**'
      - 'js/**'
      - '.github/workflows/**'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          set -e
          node --check lib/baseScraper.js
          node --check lib/normalize.js
          node --check lib/storeRegistry.js
          node --check lib/daraz.js
          node --check lib/startech.js
          node --check lib/ryans.js
          node --check lib/applegadgets.js
          node --check api/search.js
          node --check js/scrapers.js
          node --check js/app.js
