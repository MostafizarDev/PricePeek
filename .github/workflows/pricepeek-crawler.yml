name: PricePeekBD Crawler

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. These six runs are approximately every 5 hours.
    - cron: '17 0,5,10,15,20,23 * * *'

concurrency:
  group: pricepeekbd-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run independent store crawlers
        env:
          SHEETS_WEB_APP_URL: ${{ secrets.SHEETS_WEB_APP_URL }}
          CRAWLER_TOKEN: ${{ secrets.CRAWLER_TOKEN }}
          CRAWL_TIMEOUT_MS: 15000
          STORE_CONCURRENCY: 3
        run: node crawler/run.js
