name: PricePeekBD Crawler

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,5,10,15,20 * * *'

concurrency:
  group: pricepeekbd-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run independent store crawlers
        env:
          SHEETS_WEB_APP_URL: ${{ secrets.SHEETS_WEB_APP_URL }}
          CRAWLER_TOKEN: ${{ secrets.CRAWLER_TOKEN }}
          STORE_TIMEOUT_MS: 480000
          STORE_CONCURRENCY: 5
          CATALOG_CONCURRENCY: 8
          MAX_CATALOG_URLS_PER_STORE: 10000
          MAX_SITEMAPS_PER_STORE: 200
          MAX_PRODUCTS_PER_STORE: 10000
          UPLOAD_BATCH_SIZE: 500
        run: node crawler/run.js